<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <defs>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="50%" stop-color="#388BFD"/>
      <stop offset="100%" stop-color="#00C8A8"/>
    </linearGradient>
    <linearGradient id="grad-bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="grad-hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#00C8A8"/>
    </linearGradient>
    <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="#0D1117"/>
  <rect width="1200" height="280" fill="url(#grad-bg)" opacity="0.6"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1" fill="#21262D" opacity="0.8"/>
  </pattern>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- Top gradient bar -->
  <rect y="0" width="1200" height="3" fill="url(#grad-accent)"/>

  <!-- Glow orb behind hexagon -->
  <circle cx="600" cy="95" r="55" fill="#1F6FEB" opacity="0.06" filter="url(#glow-blue)"/>

  <!-- Hexagon logo mark -->
  <g transform="translate(600, 95)">
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20"
             fill="none" stroke="url(#grad-hex)" stroke-width="1.5" opacity="0.9"/>
    <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13"
             fill="#1F6FEB" opacity="0.12"/>
    <text x="0" y="7"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="700" fill="#388BFD" text-anchor="middle"
          letter-spacing="1">ICP</text>
  </g>

  <!-- Main title -->
  <text x="600" y="170"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="800" fill="#E6EDF3" text-anchor="middle" letter-spacing="-1.5">
    ICP Match
  </text>

  <!-- Subtitle -->
  <text x="600" y="202"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="17" fill="#8B949E" text-anchor="middle" letter-spacing="0.3">
    Iron-clad lead qualification engine for ibeam.ai
  </text>

  <!-- Tech stack pills -->
  <!-- Exa AI -->
  <rect x="248" y="222" width="72" height="26" rx="13" fill="#1C2128" stroke="#21262D" stroke-width="1"/>
  <text x="284" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">Exa AI</text>

  <!-- Firecrawl -->
  <rect x="330" y="222" width="80" height="26" rx="13" fill="#1C2128" stroke="#21262D" stroke-width="1"/>
  <text x="370" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">Firecrawl</text>

  <!-- ZoomInfo -->
  <rect x="420" y="222" width="78" height="26" rx="13" fill="#1C2128" stroke="#21262D" stroke-width="1"/>
  <text x="459" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">ZoomInfo</text>

  <!-- Gemini -->
  <rect x="508" y="222" width="105" height="26" rx="13" fill="#1C2128" stroke="#388BFD" stroke-width="1"/>
  <text x="560" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#388BFD" text-anchor="middle">Gemini 2.5 Pro</text>

  <!-- divider dot -->
  <circle cx="622" cy="235" r="2" fill="#30363D"/>

  <!-- Perplexity -->
  <rect x="631" y="222" width="82" height="26" rx="13" fill="#1C2128" stroke="#21262D" stroke-width="1"/>
  <text x="672" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">Perplexity</text>

  <!-- Claude -->
  <rect x="723" y="222" width="100" height="26" rx="13" fill="#1C2128" stroke="#21262D" stroke-width="1"/>
  <text x="773" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">Claude Sonnet</text>

  <!-- Airtable -->
  <rect x="833" y="222" width="72" height="26" rx="13" fill="#1C2128" stroke="#21262D" stroke-width="1"/>
  <text x="869" y="239" font-family="system-ui, sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">Airtable</text>

  <!-- Bottom gradient bar -->
  <rect y="277" width="1200" height="3" fill="url(#grad-accent)"/>
</svg>
